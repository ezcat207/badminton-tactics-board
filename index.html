<div id="langpick" hidden><h1>羽毛球战术棋盘 · Badminton Tactics Board</h1><p>选择语言 / Choose your language</p><div class="row"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">English</button></div></div><script>(function(){var p=document.getElementById("langpick");if($langChosen)return;p.hidden=false;var b=p.querySelectorAll("button");for(var i=0;i<b.length;i++){b[i].addEventListener("click",function(){$setLang(this.dataset.lang);});}})();</script><div id="lang" role="group" aria-label="Language"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button></div><script>(function(){var b=document.querySelectorAll("#lang button");for(var i=0;i<b.length;i++){(function(el){el.setAttribute("aria-pressed",String(el.dataset.lang===$lang));el.addEventListener("click",function(){if(el.dataset.lang!==$lang)$setLang(el.dataset.lang);});})(b[i]);}})();</script><script>(function(){var box=document.getElementById("lang"),c=document.getElementById("game");function hide(){box.style.display="none";c.removeEventListener("pointerdown",hide);}c.addEventListener("pointerdown",hide);document.addEventListener("keydown",function(e){if(e.key==="l"||e.key==="L")$setLang($lang==="zh"?"en":"zh");});})();</script><script src="android-entry.js"></script><script>if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(function(){});</script></body></html>
