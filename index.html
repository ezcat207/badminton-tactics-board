<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09131f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Badminton Tactics Board</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09131f;color:#eff7fb}body{display:flex;flex-direction:column}
#bar{flex:none;height:26px;display:flex;align-items:center;justify-content:flex-end;padding:0 max(6px,env(safe-area-inset-right)) 0 max(6px,env(safe-area-inset-left));background:#09131f}
#lang{display:flex;border:1px solid rgba(239,247,251,.3);border-radius:11px;overflow:hidden;font:600 11px/1 -apple-system,"Segoe UI",sans-serif}
#lang button{all:unset;cursor:pointer;padding:4px 10px;color:rgba(239,247,251,.75);-webkit-tap-highlight-color:transparent}
#lang button[aria-pressed=true]{background:#5ad1a0;color:#09131f}#lang button:focus-visible{outline:2px solid #eff7fb;outline-offset:-2px}
canvas{display:block;flex:1 1 auto;min-height:0;width:100%;touch-action:none;-webkit-tap-highlight-color:transparent}#fallback{padding:24px;line-height:1.8;font-family:sans-serif}</style>
</head><body>
<div id="bar"><div id="lang" role="group" aria-label="Language / 语言"><button type="button" data-lang="en">EN</button><button type="button" data-lang="zh">中文</button></div></div>
<canvas id="game" aria-label="Badminton Tactics Board"></canvas>
<noscript><p id="fallback">Please enable JavaScript. / 请启用 JavaScript。</p></noscript>
<script src="src/i18n-en.js"></script><script src="src/i18n.js"></script><script src="src/court-rules.js"></script><script src="src/shot-model.js"></script>
<script src="src/footwork-model.js"></script><script src="src/recovery-model.js"></script>
<script src="src/engine.js"></script><script src="src/feedback-model.js"></script><script src="src/view.js"></script>
<script>(function(){var b=document.querySelectorAll("#lang button");for(var i=0;i<b.length;i++){(function(el){el.setAttribute("aria-pressed",String(el.dataset.lang===$lang));el.addEventListener("click",function(){if(el.dataset.lang!==$lang)$setLang(el.dataset.lang);});})(b[i]);}document.addEventListener("keydown",function(e){if(e.key==="l"||e.key==="L")$setLang($lang==="zh"?"en":"zh");});})();</script>
<script src="android-entry.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(function(){});</script></body></html>
