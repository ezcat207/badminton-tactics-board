<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09131f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>羽毛球战术棋盘</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09131f;color:#eff7fb}canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-tap-highlight-color:transparent}#lang{position:fixed;bottom:max(4px,env(safe-area-inset-bottom));right:max(4px,env(safe-area-inset-right));opacity:.85;z-index:5;display:flex;border:1px solid rgba(239,247,251,.28);border-radius:14px;overflow:hidden;background:rgba(9,19,31,.72);font:600 11px/1 sans-serif}#lang button{all:unset;cursor:pointer;padding:6px 9px;color:rgba(239,247,251,.7);-webkit-tap-highlight-color:transparent}#lang button[aria-pressed=true]{background:rgba(90,209,160,.9);color:#09131f}#fallback{padding:24px;line-height:1.8;font-family:sans-serif}</style>
</head><body><canvas id="game" aria-label="羽毛球战术棋盘"></canvas>
<noscript><p id="fallback">Please enable JavaScript. / 请启用 JavaScript。</p></noscript>
<script src="src/i18n-en.js"></script><script src="src/i18n.js"></script><script src="src/court-rules.js"></script><script src="src/shot-model.js"></script>
<script src="src/footwork-model.js"></script><script src="src/recovery-model.js"></script>
<script src="src/engine.js"></script><script src="src/feedback-model.js"></script><script src="src/view.js"></script>
<div id="lang" role="group" aria-label="Language"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button></div><script>(function(){var b=document.querySelectorAll("#lang button");for(var i=0;i<b.length;i++){(function(el){el.setAttribute("aria-pressed",String(el.dataset.lang===$lang));el.addEventListener("click",function(){if(el.dataset.lang!==$lang)$setLang(el.dataset.lang);});})(b[i]);}})();</script><script>(function(){var box=document.getElementById("lang"),c=document.getElementById("game");function hide(){box.style.display="none";c.removeEventListener("pointerdown",hide);}c.addEventListener("pointerdown",hide);document.addEventListener("keydown",function(e){if(e.key==="l"||e.key==="L")$setLang($lang==="zh"?"en":"zh");});})();</script><script src="android-entry.js"></script><script>if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(function(){});</script></body></html>
